name: Build React Native Android

on:
  push:
    tags:
      - 'v*' # Quy trình sẽ tự kích hoạt khi bạn tạo tag mới (ví dụ: v1.0.0)

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # hoặc 'yarn' tùy thuộc bạn dùng gì

      - name: Cài đặt dependencies
        run: npm install # hoặc yarn install

      - name: Thiết lập Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Thiết lập Android SDK
        uses: android-actions/setup-android@v3

      - name: Build ứng dụng (Tạo file APK Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Đính kèm file APK vào GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
